<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMMC Level 1 Self-Assessment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>CMMC Level 1</h1>
      <nav id="nav"></nav>
      <div id="progress"></div>
    </aside>
    <main id="main">
      <div class="container">
        <!-- Start screen -->
        <section id="start">
          <h2 class="title">CMMC Level 1 Self-Assessment</h2>
          <p class="subtitle">Unofficial tool to assess your compliance with CMMC Level 1 controls.</p>
          <p><strong>Disclaimer:</strong> This is a free, unofficial tool. No data is stored on a server. All responses are saved locally in your browser only.</p>
          <button id="startBtn">Start Assessment</button>
        </section>
        <!-- Question screen -->
        <section id="question" hidden>
          <div id="question-content"></div>
          <form id="responseForm">
            <fieldset>
              <legend>Status</legend>
              <div class="radio-group">
                <label for="status-met"><input id="status-met" type="radio" name="status" value="MET" required /> MET</label>
                <label for="status-notmet"><input id="status-notmet" type="radio" name="status" value="NOT MET" /> NOT MET</label>
                <label for="status-na"><input id="status-na" type="radio" name="status" value="N/A" /> N/A</label>
              </div>
            </fieldset>
            <textarea id="evidence" placeholder="Enter evidence or comments..."></textarea>
            <div class="nav-buttons">
              <button type="button" id="prevBtn">Previous</button>
              <button type="submit" id="nextBtn">Next</button>
            </div>
          </form>
        </section>
        <!-- Summary screen -->
        <section id="summary" hidden>
          <h2>Assessment Summary</h2>
          <div id="summary-stats"></div>
          <!-- Signature capture -->
          <div id="signature-section" hidden>
            <h3>Signature</h3>
            <div class="signature-inputs">
              <label for="signatureName">Name:</label>
              <input id="signatureName" type="text" placeholder="Enter your name" />
            </div>
            <div class="signature-affirm">
              <label><input type="checkbox" id="affirmCheckbox" /> I affirm that the above information is complete and accurate.</label>
            </div>
          </div>
          <div class="summary-buttons">
            <button id="downloadBtn">Download PDF</button>
            <button id="restartBtn" class="restart">Restart</button>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="html2pdf.bundle.min.js"></script>
</body>
</html>
